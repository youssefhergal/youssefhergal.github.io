<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test GitHub Pages — Youssef Hergal</title>
  <style>
    :root {
      --navy: #1b365d;
      --teal: #0f766e;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #dbeafe 0%, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 18px 50px rgba(27, 54, 93, 0.12);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ecfdf5;
      color: var(--teal);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    h1 {
      color: var(--navy);
      font-size: 1.75rem;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 22px;
    }
    .meta {
      font-size: 14px;
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 22px;
      text-align: left;
    }
    .meta div { margin: 4px 0; }
    .meta strong { color: var(--navy); }
    a.btn {
      display: inline-block;
      text-decoration: none;
      background: var(--navy);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      margin: 4px;
    }
    a.btn.secondary {
      background: white;
      color: var(--navy);
      border: 1px solid #d1d5db;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> GitHub Pages fonctionne</div>
    <h1>Youssef Hergal</h1>
    <p>
      Page de test pour vérifier que
      <strong>youssefhergal.github.io</strong> est bien en ligne.
    </p>
    <div class="meta">
      <div><strong>URL testée :</strong> <span id="url">chargement…</span></div>
      <div><strong>Chargée le :</strong> <span id="now"></span></div>
      <div><strong>Statut :</strong> si tu vois cette page, le site répond.</div>
    </div>
    <a class="btn" href="https://www.youssefhergal.com">Portfolio</a>
    <a class="btn secondary" href="https://github.com/youssefhergal">GitHub</a>
  </main>
  <script>
    document.getElementById("url").textContent = window.location.href;
    document.getElementById("now").textContent = new Date().toLocaleString("fr-FR");
  </script>
</body>
</html>
